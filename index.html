<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KPP Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
    }

    .header {
      background: #263238;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 23px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 500px;
      margin: 20px auto;
    }

    .pilih {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      margin-bottom: 15px;
      text-align: center;
    }

    .judul {
      font-size: 15px;
      color: #777;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .jenis-btn {
      width: 48%;
      padding: 14px 5px;
      margin: 0;
      border: 2px solid #263238;
      border-radius: 10px;
      background: white;
      color: #263238;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .jenis-btn.aktif {
      background: #263238;
      color: white;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 18px;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .label {
      font-size: 14px;
      color: #777;
    }

    #jenisTerpilih {
      margin-top: 5px;
      font-size: 15px;
      font-weight: bold;
      color: #263238;
    }

    #barcode {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }

    #status {
      margin-top: 10px;
      font-size: 16px;
    }

    .success {
      color: #168a3a;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .info {
      color: #555;
    }

    button {
      cursor: pointer;
    }

    #btnScan {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #263238;
      color: white;
      font-size: 16px;
    }

  </style>
</head>

<body>

<div class="header">
  KPP SCANNER
</div>

<div class="container">

  <!-- PILIH JENIS -->
  <div class="pilih">

    <div class="judul">
      PILIH JENIS PRODUK
    </div>

    <button
      class="jenis-btn"
      id="btnPlafon"
      onclick="pilihJenis('PLAFON')">
      PLAFON
    </button>

    <button
      class="jenis-btn"
      id="btnWallboard"
      onclick="pilihJenis('WALLBOARD')">
      WALLBOARD
    </button>

  </div>

  <!-- CAMERA -->
  <div class="card">

    <div id="reader"></div>

  </div>

  <!-- HASIL -->
  <div class="hasil">

    <div class="label">
      HASIL SCAN
    </div>

    <div id="jenisTerpilih">
      Pilih PLAFON atau WALLBOARD
    </div>

    <div id="barcode">
      Belum ada
    </div>

    <div id="status">
      Pilih jenis produk terlebih dahulu
    </div>

    <button
      onclick="scanLagi()"
      id="btnScan"
      style="display:none;">
      SCAN LAGI
    </button>

  </div>

</div>


<script>

/* ==========================================
   LINK GOOGLE APPS SCRIPT
========================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycby0-lDl1Hf8qBPXvFf0AOVOQkMYsLCNDy_PTn9kpriQPc6oDhBBfc4uj2WyGAdDWI3Y/exec";


/* ==========================================
   VARIABLE
========================================== */

let sudahScan = false;

let scanner = null;

let jenisDipilih = "";


/* ==========================================
   PILIH PLAFON / WALLBOARD
========================================== */

function pilihJenis(jenis) {

  jenisDipilih = jenis;

  sudahScan = false;

  document.getElementById("btnPlafon")
    .classList.remove("aktif");

  document.getElementById("btnWallboard")
    .classList.remove("aktif");


  if (jenis === "PLAFON") {

    document.getElementById("btnPlafon")
      .classList.add("aktif");

  }


  if (jenis === "WALLBOARD") {

    document.getElementById("btnWallboard")
      .classList.add("aktif");

  }


  document.getElementById("jenisTerpilih")
    .innerText = "JENIS: " + jenis;


  document.getElementById("status")
    .innerHTML =
      '<span class="info">' +
      'Arahkan kamera ke barcode ' +
      jenis +
      '</span>';


  document.getElementById("btnScan")
    .style.display = "none";


  /*
    Kalau scanner sebelumnya berjalan,
    matikan dahulu.
  */

  if (scanner) {

    scanner.stop()
      .then(function() {

        document.getElementById("reader")
          .innerHTML = "";

        mulaiScanner();

      })
      .catch(function() {

        document.getElementById("reader")
          .innerHTML = "";

        mulaiScanner();

      });

  } else {

    mulaiScanner();

  }

}


/* ==========================================
   BARCODE BERHASIL DIBACA
========================================== */

function berhasilScan(teks) {

  if (sudahScan) return;

  if (!jenisDipilih) {
    document.getElementById("status").innerHTML =
      '<span class="error">Pilih PLAFON atau WALLBOARD</span>';
    return;
  }

  teks = String(teks).trim();

  if (!teks) return;

  sudahScan = true;

  document.getElementById("barcode").innerText = teks;

  document.getElementById("status").innerHTML =
    '<span class="info">⏳ MENYIMPAN KE ' +
    jenisDipilih +
    '...</span>';

  // MATIKAN KAMERA
  if (scanner) {
    scanner.stop().catch(function(){});
  }

  console.log("================================");
  console.log("BARCODE :", teks);
  console.log("JENIS   :", jenisDipilih);
  console.log("================================");

  // ==========================================
  // KIRIM KE APPS SCRIPT TANPA POPUP
  // ==========================================

  const data = new URLSearchParams();

  data.append("barcode", teks);
  data.append("jenis", jenisDipilih);

  const terkirim = navigator.sendBeacon(
    WEB_APP_URL,
    data
  );

  console.log("SEND BEACON:", terkirim);

  // ==========================================
  // STATUS
  // ==========================================

  if (terkirim) {

    document.getElementById("status").innerHTML =
      '<span class="success">✓ DATA DIKIRIM KE ' +
      jenisDipilih +
      '</span>';

    document.getElementById("btnScan")
      .style.display = "inline-block";

  } else {

    document.getElementById("status").innerHTML =
      '<span class="error">✕ GAGAL MENGIRIM DATA</span>';

    document.getElementById("btnScan")
      .style.display = "inline-block";
  }

}
  
/* ==========================================
   MULAI SCANNER
========================================== */

function mulaiScanner() {

  if (!jenisDipilih) {
    return;
  }


  sudahScan = false;


  document.getElementById("barcode")
    .innerText = "Belum ada";


  document.getElementById("status")
    .innerHTML =
      '<span class="info">' +
      'Arahkan kamera ke barcode ' +
      jenisDipilih +
      '</span>';


  document.getElementById("btnScan")
    .style.display = "none";


  /*
    Bersihkan reader
  */

  document.getElementById("reader")
    .innerHTML = "";


  /*
    Buat scanner baru
  */

  scanner =
    new Html5Qrcode("reader");


  /*
    Mulai kamera
  */

  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {

        width: 280,

        height: 150

      }

    },

    berhasilScan,

    function(errorMessage) {

      // Error scan sementara diabaikan

    }

  ).catch(function(error) {

    document.getElementById("status")
      .innerHTML =
        '<span class="error">' +
        'Kamera gagal dibuka: ' +
        error +
        '</span>';

  });

}


/* ==========================================
   SCAN LAGI
========================================== */

function scanLagi() {

  document.getElementById("reader")
    .innerHTML = "";


  document.getElementById("barcode")
    .innerText = "Belum ada";


  document.getElementById("status")
    .innerHTML =
      '<span class="info">' +
      'Arahkan kamera ke barcode ' +
      jenisDipilih +
      '</span>';


  document.getElementById("btnScan")
    .style.display = "none";


  sudahScan = false;


  mulaiScanner();

}


/* ==========================================
   SAAT HALAMAN DIBUKA
========================================== */

window.onload = function() {

  document.getElementById("status")
    .innerText =
      "Pilih PLAFON atau WALLBOARD";

};

</script>

</body>
</html>
