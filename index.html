<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KPP Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
    }

    .header {
      background: #263238;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 23px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 500px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    #reader {
      width: 100%;
    }

    .hasil {
      margin-top: 18px;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .label {
      font-size: 14px;
      color: #777;
    }

    #barcode {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }

    #status {
      margin-top: 10px;
      font-size: 16px;
    }

    .success {
      color: #168a3a;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #263238;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  KPP SCANNER
</div>

<div class="container">

  <div class="card">
    <div id="reader"></div>
  </div>

  <div class="hasil">

    <div class="label">
      HASIL SCAN
    </div>

    <div id="barcode">
      Belum ada
    </div>

    <div id="status">
      Arahkan kamera ke barcode
    </div>

    <button onclick="scanLagi()" id="btnScan" style="display:none;">
      SCAN LAGI
    </button>

  </div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzECB01rtS4M5hupiKlyGtexXYIAmGxLA54uG17zKcFlLSPYnhdROIDzVOp1kqoaFXb/exec";

let sudahScan = false;
let scanner = null;


function berhasilScan(teks) {

  if (sudahScan) return;

  sudahScan = true;

  document.getElementById("barcode").innerText = teks;

  document.getElementById("status").innerHTML =
    '<span>⏳ Menyimpan ke HASIL PRODUKSI...</span>';

  scanner.stop().catch(function() {});


  // Kirim barcode ke Apps Script
  const kirim = new Image();

  kirim.onload = function() {

    document.getElementById("status").innerHTML =
      '<span class="success">✓ DATA TERSIMPAN</span>';

    document.getElementById("btnScan").style.display = "inline-block";

  };

  kirim.onerror = function() {

    // Request tetap bisa sudah diterima Google.
    // Kita tetap tampilkan status selesai.
    document.getElementById("status").innerHTML =
      '<span class="success">✓ SCAN TERKIRIM</span>';

    document.getElementById("btnScan").style.display = "inline-block";

  };

  kirim.src =
    WEB_APP_URL +
    "?barcode=" +
    encodeURIComponent(teks) +
    "&t=" +
    Date.now();
}


function mulaiScanner() {

  sudahScan = false;

  document.getElementById("barcode").innerText =
    "Belum ada";

  document.getElementById("status").innerText =
    "Arahkan kamera ke barcode";

  document.getElementById("btnScan").style.display =
    "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 150
      }
    },

    berhasilScan,

    function(errorMessage) {
      // abaikan error scan sementara
    }

  ).catch(function(error) {

    document.getElementById("status").innerHTML =
      '<span class="error">Kamera gagal dibuka: ' +
      error +
      '</span>';

  });
}


function scanLagi() {

  document.getElementById("reader").innerHTML = "";

  mulaiScanner();
}


window.onload = function() {
  mulaiScanner();
};

</script>

</body>
</html>
